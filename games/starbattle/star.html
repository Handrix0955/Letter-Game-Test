<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>命中注定：宝宝捕捉计划</title>
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="star.css">
    <link rel="manifest" href="../../manifest.json">
    <link rel="apple-touch-icon" href="../../assets/app-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body data-skin="default" data-theme="dark">

    <canvas id="canvas-fx"></canvas>
    <canvas id="canvas-confetti"></canvas>

    <div class="header">
        <a href="../../index.html" class="hall-back glass-panel">
            <svg class="icon" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            返回大厅
        </a>
        <h1 id="main-title">命中注定：宝宝捕捉计划</h1>
    </div>

    <div class="top-controls">
        <select id="diff-select" class="glass-panel" onchange="startNewGame()">
            <option value="7">7x7 (简单)</option>
            <option value="8" selected>8x8 (中等)</option>
            <option value="9">9x9 (困难)</option>
        </select>
        
        <div class="glass-panel" style="display:flex; gap: 10px; padding: 0 10px; align-items:center; flex: 0 0 auto;">
            <div id="timer" style="font-variant-numeric: tabular-nums; font-size:13px; display:flex; align-items:center; gap:4px; color: var(--text-main);">
                <svg class="icon inline-icon" style="width:14px;height:14px;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 00:00
            </div>
            <div id="hp-container" style="display:flex; gap: 2px;"></div>
        </div>
        
        <button id="new-game-btn" onclick="startNewGame()" style="background:#8b5cf6; color:white; border:none; box-shadow: 0 4px 6px rgba(139, 92, 246, 0.3);">新局</button>
    </div>

    <div id="star-board" class="board"></div>

    <div class="action-row">
        <button class="action-btn" id="target-btn" onclick="toggleTarget()" style="color: #ec4899;">
            <svg class="icon" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> 
            <span id="target-text">找 Irene</span>
        </button>
        <!-- 新增战绩按钮 -->
        <button class="action-btn" onclick="openStats()">
            <svg class="icon" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg> 战绩
        </button>
        <button class="action-btn" onclick="openRules()">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg> 规则
        </button>
        <button class="action-btn" id="theme-btn" onclick="toggleTheme()">
            <svg class="icon" id="theme-icon" viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1.3.5 2.6 1.5 3.5.7.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg> <span id="theme-text">开灯</span>
        </button>
    </div>

    <!-- 规则弹窗 -->
    <div class="modal-overlay" id="rulesModal">
        <div class="modal-content">
            <h2><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg> 星战谜题规则</h2>
            <hr style="border: 0; border-top: 1px solid var(--glass-border); margin-bottom: 10px;">
            <h3><svg class="inline-icon" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg> 核心目标：</h3>
            <ul>
                <li>在每个<b>加粗的颜色区块</b>内，找出隐藏的专属头像！</li>
                <li>每一行、每一列、每个颜色区块，<b>只能有 1 个头像</b>。</li>
                <li>头像与头像之间<b>绝对不能相邻</b>（包括对角线）。</li>
            </ul>
            <h3><svg class="inline-icon" viewBox="0 0 24 24"><path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.93 4.93l2.83 2.83"/><path d="M16.24 16.24l2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="M4.93 19.07l2.83-2.83"/><path d="M16.24 7.76l2.83-2.83"/></svg> 操作指北：</h3>
            <ul>
                <li><b>自由打叉</b>：单点或滑动格子，可画白色的叉号 <svg class="inline-icon" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>（草稿，不扣血）。</li>
                <li><b>滑动擦除</b>：从<b>已画叉</b>的格子起手拖动，划过的叉号会被一并抹掉（画错了随手就能清理）。</li>
                <li><b>判定决断</b>：快速<b>双击</b>格子，即可放置头像。</li>
                <li><b>严苛惩罚</b>：双击放错位置，心碎扣血且该格子永久变红锁死！血量耗尽即失败。</li>
            </ul>
            <button class="close-btn" onclick="closeModal('rulesModal')">知道啦宝宝！</button>
        </div>
    </div>

    <!-- 战绩弹窗 -->
    <div class="modal-overlay" id="statsModal">
        <div class="modal-content">
            <h2><svg class="icon" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg> 个人战绩看板</h2>
            <table class="stats-table" id="statsTable"></table>
            <p style="font-size: 11px; color: var(--text-note); text-align: center; margin-top: 15px;">* 宝宝好聪明～做得好快呀！</p>
            <button class="close-btn" onclick="closeModal('statsModal')">继续加油！</button>
        </div>
    </div>

    <img id="preload-handrix" src="../../assets/handrix.png" style="display:none;">
    <img id="preload-irene" src="../../assets/irene.png" style="display:none;">

    <script src="../../js/common.js"></script>
    <script src="bank.js"></script>
    <script src="star.js"></script>
<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
            navigator.serviceWorker.register("../sw.js").catch(function (err) {
                console.warn("SW register failed:", err);
            });
        });
    }
    </script>
</body>
</html>
